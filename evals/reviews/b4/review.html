<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GigBid human review</title><style>body{font:17px system-ui;max-width:900px;margin:2rem auto;padding:1rem;color:#17202a;background:#fafafa}article,details{background:white;border:1px solid #ccc;border-radius:8px;padding:1rem;margin:1rem 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}button,select,input{font:inherit;padding:.6rem;margin:.3rem;max-width:100%;box-sizing:border-box}button{cursor:pointer}#error{color:#a40000}label{display:block;margin:1rem 0}.twocol{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}</style>
<h1>GigBid human review</h1><p id="instructions">Loadingâ€¦</p><p id="scope"></p><details><summary>Quality rubric</summary><div id="rubric"></div></details>
<p id="progress" role="status"></p><article><h2 id="jobtitle"></h2><pre id="job"></pre><div id="texts" class="twocol"></div><details><summary>Source evidence</summary><div id="evidence"></div></details>
<label>Your rating <select id="rating"><option value="">Choose a rating</option></select></label></article>
<button id="previous">Previous</button><button id="next">Next</button><label>Your reviewer alias <input id="alias" minlength="2" maxlength="80" autocomplete="off"></label>
<label><input type="checkbox" id="confirmed"> I personally reviewed every item. These are my own ratings, not model-generated answers.</label>
<button id="submit" disabled>Save completed ratings</button><button id="download" disabled>Download completed ratings</button><p id="message" role="status"></p><p id="error" role="alert"></p>
<script>
let pack,hash,index=0,labels={},kind=location.pathname==='/panel'?'panel':'calibration';const el=id=>document.getElementById(id);
function autosave(){if(kind==='panel')return;localStorage.setItem('gigbid-review-'+hash,JSON.stringify({labels,alias:el('alias').value,index}));}
function update(){const count=Object.keys(labels).length;el('progress').textContent=`Item ${index+1} of ${pack.items.length}; ${count} rated. Draft ratings are saved in this browser.`;const ready=count===pack.items.length&&el('confirmed').checked&&el('alias').value.trim().length>=2;el('submit').disabled=el('download').disabled=!ready;}
function show(){const item=pack.items[index];el('jobtitle').textContent=item.job.title;el('job').textContent=(item.job.description||'No additional job description is available.')+'\n\nRequired skills: '+(item.job.required_skills||[]).join(', ')+'\nScreening questions: '+(item.job.screening_questions||[]).join(' | ');el('texts').replaceChildren();for(const [name,text,answers] of kind==='panel'?[['Proposal A',item.A,item.A_answers],['Proposal B',item.B,item.B_answers]]:[['Proposal',item.proposal,item.screening_answers]]){let d=document.createElement('div'),h=document.createElement('h3'),p=document.createElement('pre');h.textContent=name;p.textContent=(text||'[No proposal text was produced]')+(answers?.length?'\n\nScreening answers:\n'+answers.join('\n\n'):'');d.append(h,p);el('texts').append(d);}el('evidence').replaceChildren();for(const source of item.evidence){let p=document.createElement('pre');p.textContent=`[${source.evidence_id}] ${source.title}\n${source.summary}\nSource: ${source.source}; outcome: ${source.outcome??'unknown'}`;el('evidence').append(p);}el('rating').value=labels[item.id]??'';el('previous').disabled=index===0;el('next').disabled=index===pack.items.length-1;update();}
function payload(){return {pack_sha256:hash,reviewer:el('alias').value.trim(),role:kind==='panel'?'classmate':'author',personally_reviewed:el('confirmed').checked,labels:pack.items.map(i=>kind==='panel'?{id:i.id,choice:labels[i.id]}:{id:i.id,score:Number(labels[i.id])})};}
el('rating').onchange=()=>{if(kind==='panel'){if(el('alias').value.trim().length<2){el('rating').value='';return;}el('alias').disabled=true;}if(el('rating').value==='')delete labels[pack.items[index].id];else labels[pack.items[index].id]=el('rating').value;autosave();update();};el('previous').onclick=()=>{index--;show();autosave();};el('next').onclick=()=>{index++;show();autosave();};el('alias').oninput=()=>{if(kind==='panel')el('rating').disabled=el('alias').value.trim().length<2;autosave();update();};el('confirmed').onchange=update;
el('submit').onclick=async()=>{try{const response=await fetch('/ratings/'+kind,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())});const result=await response.json();if(!response.ok)throw Error(result.detail);el('message').textContent=`Saved your ${result.items} personal ratings. Return to the assignment conversation.`;}catch(e){el('error').textContent=e.message;}};
el('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload(),null,2)],{type:'application/json'}));a.download='gigbid-'+kind+'-ratings.json';a.click();URL.revokeObjectURL(a.href);};
fetch('/pack/'+kind).then(async r=>{const result=await r.json();if(!r.ok)throw Error(result.detail);pack=result.pack;hash=result.pack_sha256;el('instructions').textContent=pack.instructions;el('scope').textContent=pack.scope||'Blind comparison: pipeline names and model scores are hidden.';for(const [score,description]of Object.entries(pack.rubric||{})){let p=document.createElement('p');p.textContent=score+': '+description;el('rubric').append(p);}for(const [value,text]of(kind==='panel'?[['A','A is better'],['B','B is better'],['tie','Tie'],['both_poor','Both are poor']]:[0,1,2,3,4].map(n=>[n,String(n)]))){let o=document.createElement('option');o.value=value;o.textContent=text;el('rating').append(o);}if(kind==='panel'){el('rating').disabled=true;el('message').textContent='Enter your alias before rating. Each classmate must reload this page for a fresh independent review; votes are not copied between reviewers.';}let saved=kind==='calibration'?JSON.parse(localStorage.getItem('gigbid-review-'+hash)||'null'):null;if(saved){labels=saved.labels||{};el('alias').value=saved.alias||'';index=Math.min(saved.index||0,pack.items.length-1);}show();}).catch(e=>{el('instructions').textContent='This review pack is not ready.';el('error').textContent=e.message;});
</script></html>
