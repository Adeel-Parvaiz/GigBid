name: ci
on: [pull_request, push]
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres: {image: "postgres:16", env: {POSTGRES_USER: gigbid, POSTGRES_PASSWORD: gigbid, POSTGRES_DB: gigbid}, ports: ["5432:5432"]}
      redis: {image: "redis:7", ports: ["6379:6379"]}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev,postgres]"
      - run: ruff check .
      - run: python scripts/check_repo_rules.py
      - name: MCP in-memory, schema snapshot, unit and integration tests
        run: pytest -q --junitxml=test-results/python.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: python-test-report, path: test-results/python.xml}
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: pip install -e ".[dev]"
      - run: cd apps/web && npm ci && npm run gen:api && npm run build
      - run: cd apps/web && npx playwright install --with-deps chromium && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: playwright-report, path: apps/web/playwright-report}
